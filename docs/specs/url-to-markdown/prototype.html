<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>FeedMe 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }
</style>
<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>
<main class="sh-stage">
<style>
  /* ── project tokens: copied verbatim from app/globals.css (:root and .dark → .sh-theme-dark) ── */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
    /* Geist (network font) replaced with a system stack */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
  }

  /* ── product styles (shadcn-equivalent) ── */
  .app { display: grid; gap: 24px; color: var(--foreground); font-size: 14px; line-height: 1.5 }
  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px }
  .brand-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--primary); color: var(--primary-foreground);
    display: grid; place-items: center; font: 600 12px var(--mono) }
  .hero h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em }
  .hero p { margin: 0; color: var(--muted-foreground) }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px;
    border-radius: calc(var(--radius) * 0.8); border: 1px solid transparent; font: 500 14px var(--font); cursor: pointer; white-space: nowrap }
  .btn svg { width: 16px; height: 16px }
  .btn-default { background: var(--primary); color: var(--primary-foreground) }
  .btn-outline { background: var(--background); color: var(--foreground); border-color: var(--border) }
  .btn-outline:hover, .btn-ghost:hover { background: var(--accent) }
  .btn-ghost { background: none; color: var(--foreground) }
  .btn-icon { width: 36px; padding: 0 }
  .btn-sm { height: 32px; padding: 0 10px; font-size: 13px }
  .btn:disabled { opacity: .5; pointer-events: none }
  .btn:focus-visible, .input:focus-visible, .toggle:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring) 50%, transparent); outline-offset: 0 }

  .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4) }
  .card-pad { padding: 20px }

  .url-form { display: flex; gap: 8px }
  .input-wrap { position: relative; flex: 1; min-width: 0 }
  .input { width: 100%; height: 36px; padding: 0 36px 0 12px; border: 1px solid var(--input); border-radius: calc(var(--radius) * 0.8);
    background: transparent; color: var(--foreground); font: 14px var(--font) }
  .input::placeholder { color: var(--muted-foreground) }
  .input[aria-invalid="true"] { border-color: var(--destructive) }
  .input-clear { position: absolute; right: 2px; top: 2px; height: 32px; width: 32px; color: var(--muted-foreground) }
  .field-error { margin: 6px 0 0; color: var(--destructive); font-size: 13px }
  .field-hint { margin: 6px 0 0; color: var(--muted-foreground); font-size: 13px }

  .alert { display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; padding: 12px 16px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--card) }
  .alert svg { width: 16px; height: 16px; margin-top: 2px }
  .alert-destructive { color: var(--destructive) }
  .alert-title { font-weight: 500 }
  .alert-desc { grid-column: 2; color: var(--muted-foreground); font-size: 13px }

  .empty { text-align: center; padding: 48px 20px; border: 1px dashed var(--border); border-radius: calc(var(--radius) * 1.4) }
  .empty-icon { width: 40px; height: 40px; margin: 0 auto 12px; border-radius: var(--radius); background: var(--muted);
    display: grid; place-items: center; color: var(--foreground) }
  .empty-icon svg { width: 20px; height: 20px }
  .empty h3 { margin: 0 0 4px; font-size: 15px }
  .empty p { margin: 0 auto; max-width: 380px; color: var(--muted-foreground) }

  .sk { background: var(--muted); border-radius: 6px; animation: pulse 1.6s ease-in-out infinite }
  @keyframes pulse { 50% { opacity: .5 } }

  .result-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; padding: 20px; border-bottom: 1px solid var(--border) }
  .result-head h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.35; letter-spacing: -0.01em; overflow-wrap: anywhere }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted-foreground); font-size: 13px }
  .meta a { color: inherit; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere }
  .head-actions { display: flex; gap: 8px; flex-shrink: 0 }

  .send { padding: 16px 20px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 50%, transparent); display: grid; gap: 12px }
  .send-label { font-weight: 500; font-size: 13px }
  .send-label span { color: var(--muted-foreground); font-weight: 400 }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px }
  .toggle { height: 32px; padding: 0 12px; border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--border); background: var(--background);
    color: var(--foreground); font: 13px var(--font); cursor: pointer }
  .toggle[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary) }
  .send-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
  .send-preview { color: var(--muted-foreground); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 }
  .send-btns { display: flex; gap: 8px }

  .md { padding: 24px 20px 28px; font-size: 15px; line-height: 1.75; overflow-wrap: anywhere }
  .md > :first-child { margin-top: 0 }
  .md h2 { font-size: 18px; margin: 28px 0 8px }
  .md h3 { font-size: 16px; margin: 22px 0 6px }
  .md p { margin: 0 0 14px }
  .md a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px }
  .md ul { padding-left: 22px; margin: 0 0 14px }
  .md blockquote { margin: 0 0 14px; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted-foreground) }
  .md code { font: 13px var(--mono); background: var(--muted); padding: 1px 5px; border-radius: 4px }
  .md pre { background: var(--muted); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; margin: 0 0 14px }
  .md pre code { background: none; padding: 0 }
  .md figure { margin: 0 0 14px }
  .md figure .wf-pic { aspect-ratio: 16/7 }
  .md figcaption { color: var(--muted-foreground); font-size: 13px; margin-top: 6px }
  .md table { border-collapse: collapse; margin: 0 0 14px; font-size: 14px; width: 100% }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; display: flex; gap: 10px; align-items: flex-start;
    max-width: min(420px, calc(100vw - 32px)); padding: 12px 16px; border-radius: var(--radius); background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); box-shadow: 0 8px 24px rgb(0 0 0 / .12); font-size: 13px }
  .toast b { display: block; font-weight: 500; font-size: 14px }
  .toast span { color: var(--muted-foreground) }

  /* responsive (real viewport and simulated presets) */
  @media (max-width: 640px) { .result-head { flex-direction: column } .url-form { flex-direction: column } .url-form > .btn { width: 100% } }
  .sh-vp-390 .result-head { flex-direction: column }
  .sh-vp-390 .url-form { flex-direction: column }
  .sh-vp-390 .url-form > .btn, .sh-vp-390 .send-btns, .sh-vp-390 .send-btns .btn { width: 100%; flex: 1 }
  .sh-vp-390 .send-preview { flex-basis: 100% }
  .sh-vp-390 .head-actions { width: 100% }
  .sh-vp-390 .head-actions .btn { flex: 1 }
  .sh-vp-390 .hero h1 { font-size: 20px }
</style>

<section data-screen="home" data-title="변환 화면" data-states="변환 중,변환 결과,결과(저자 없음),오류: 잘못된 URL,오류: 페이지 가져오기 실패,오류: 본문 없음">

          <label for="url" class="sr" hidden>페이지 URL</label>
          <input class="input" id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com/article" data-component="Input">
          <button type="button" class="btn btn-ghost btn-icon input-clear" id="clearBtn" aria-label="지우기" title="지우기" data-component="Button" hidden><svg><use href="#i-x"/></svg></button>

      <div class="empty-icon"><svg><use href="#i-file"/></svg></div>

      <p>블로그 글, 문서, 뉴스 기사처럼 본문이 있는 페이지에서 잘 동작합니다.</p>
    </div>

    <!-- loading -->

      <div class="md" style="display:grid;gap:10px">
        <div class="sk" style="height:14px"></div><div class="sk" style="height:14px;width:92%"></div><div class="sk" style="height:14px;width:85%"></div>
        <div class="sk" style="height:18px;width:35%;margin-top:14px"></div><div class="sk" style="height:14px"></div><div class="sk" style="height:14px;width:78%"></div>
      </div>

    <!-- error -->
    <div class="alert alert-destructive" id="vError" role="alert" hidden data-component="Alert">
      <svg><use href="#i-alert"/></svg>

      <div class="alert-desc" id="errDesc"></div>

    <!-- result -->
    <article class="card" id="vResult" hidden data-component="Card">
      <div class="result-head">
        <div style="min-width:0">
          <h2 id="rTitle"></h2>
          <div class="meta">

      <div class="send" data-component="new:SendToLLM">
        <div class="send-label">LLM으로 보내기 <span>· 프롬프트는 선택 사항입니다</span></div>
        <div class="toggles" role="group" aria-label="프롬프트" data-component="ToggleGroup" id="presets">
          <button class="toggle" type="button" aria-pressed="false" data-p="요약해줘">요약해줘</button>
          <button class="toggle" type="button" aria-pressed="false" data-p="한국어로 번역해줘">한국어로 번역해줘</button>
          <button class="toggle" type="button" aria-pressed="false" data-p="쉽게 설명해줘">쉽게 설명해줘</button>
          <button class="toggle" type="button" aria-pressed="false" data-p="__custom">직접 입력</button>

        <input class="input" id="customPrompt" style="padding-right:12px" placeholder="예: 핵심 주장 3가지와 근거를 표로 정리해줘" hidden data-component="Input">

            <button class="btn btn-default btn-sm" id="gptBtn" data-component="Button"><svg><use href="#i-ext"/></svg>ChatGPT로 열기</button>
            <button class="btn btn-default btn-sm" id="claudeBtn" data-component="Button"><svg><use href="#i-ext"/></svg>Claude로 열기</button>

<script>
const $ = id => document.getElementById(id);
const DATA = {
  withAuthor: {
    url: 'https://engineering.example.com/blog/2026/11/postgres-connection-pooling-at-scale',
    title: '초당 4만 건 요청을 버티기까지: PostgreSQL 커넥션 풀링 3년의 기록',
    author: '김서연, 박지훈', site: 'Example Engineering', date: '2026년 11월 12일',
    html: `<p>2023년 봄, 우리 서비스의 피크 트래픽은 초당 3,200건이었습니다. 지금은 41,780건입니다. 그 사이에 데이터베이스 커넥션 때문에 장애가 세 번 났고, 세 번 모두 원인은 달랐습니다.</p>
<h2>문제: 커넥션은 생각보다 비싸다</h2>
<p>PostgreSQL은 커넥션마다 프로세스를 하나씩 띄웁니다. 커넥션 하나가 차지하는 메모리는 설정에 따라 다르지만, 우리 환경에서는 평균 <code>9.4MB</code>였습니다.</p>
<ul><li>애플리케이션 파드 120개 × 풀 크기 20 = 최대 2,400개 커넥션</li><li>DB 인스턴스의 <code>max_connections</code>는 500</li><li>배포 중에는 구·신 파드가 겹쳐 순간적으로 두 배</li></ul>
<blockquote>“커넥션 수는 CPU 코어 수의 두세 배를 넘기지 마라”는 오래된 조언은 지금도 대체로 맞습니다.</blockquote>
<h2>PgBouncer 도입과 트랜잭션 모드의 함정</h2>
<p>트랜잭션 모드로 바꾸자 커넥션 수는 2,400개에서 180개로 줄었습니다. 대신 prepared statement가 깨졌습니다.</p>
<pre><code>-- 트랜잭션 모드에서 실패하는 패턴
PREPARE get_user AS SELECT * FROM users WHERE id = $1;
EXECUTE get_user(42);  -- 다른 서버 커넥션에서 실행될 수 있음</code></pre>
<figure><div class="wf-pic"></div><figcaption>그림 1. 도입 전후 활성 커넥션 수 (2024년 3월)</figcaption></figure>
<h3>결과 요약</h3>
<table><thead><tr><th>지표</th><th>도입 전</th><th>도입 후</th></tr></thead><tbody><tr><td>p99 지연</td><td>412ms</td><td>87ms</td></tr><tr><td>활성 커넥션</td><td>2,400</td><td>180</td></tr><tr><td>월간 장애</td><td>1.3회</td><td>0회</td></tr></tbody></table>
<p>다음 글에서는 읽기 복제본으로 트래픽을 나누면서 겪은 복제 지연 문제를 다룹니다.</p>`
  },
  noAuthor: {
    url: 'https://docs.example.dev/guide/getting-started',
    title: '시작하기',
    author: '', site: 'docs.example.dev', date: '',
    html: `<p>이 가이드는 5분 안에 첫 프로젝트를 실행하는 방법을 설명합니다.</p>
<h2>설치</h2><pre><code>npm install example-cli -g</code></pre>
<h2>프로젝트 만들기</h2><p><code>example new my-app</code>을 실행하면 기본 템플릿으로 폴더가 생성됩니다.</p>`
  }
};
const ERRORS = {
  invalid: null,
  fetch: ['페이지를 가져오지 못했습니다', '사이트가 응답하지 않거나 접근을 막았습니다(HTTP 403). 주소를 확인하거나 잠시 후 다시 시도하세요.'],
  empty: ['본문을 찾지 못했습니다', '이 페이지에서 추출할 본문이 없습니다. 로그인이 필요하거나 스크립트로만 그려지는 페이지일 수 있습니다.']
};

let doc = null, prompt = '', choice = null, toastTimer;
const url = $('url');

function view(name) { ['vEmpty','vLoading','vError','vResult'].forEach(v => $(v).hidden = v !== name); }
function syncInput() {
  const has = url.value.trim() !== '';
  $('clearBtn').hidden = !has;
  $('convertBtn').disabled = !has;
}
function setInvalid(on) { url.setAttribute('aria-invalid', on); $('urlError').hidden = !on; }

function renderResult(d) {
  doc = d;
  $('rTitle').textContent = d.title;
  const metaBits = [d.author, d.date].filter(Boolean).join(' · ');
  $('rAuthor').textContent = metaBits; $('rAuthor').hidden = !metaBits;
  $('rUrl').textContent = d.url.replace(/^https?:\/\//, ''); $('rUrl').href = d.url;
  $('rBody').innerHTML = d.html;
  resetPrompt();
  view('vResult');
}
function showError(kind) {
  if (kind === 'invalid') { setInvalid(true); view(doc ? 'vResult' : 'vEmpty'); return; }
  $('errTitle').textContent = ERRORS[kind][0]; $('errDesc').textContent = ERRORS[kind][1];
  view('vError');
}

function convert(forced) {
  const v = url.value.trim();
  setInvalid(false);
  if (!/^https?:\/\/[^\s.]+\.[^\s]+$/.test(v)) { showError('invalid'); prototypeShell.setState('오류: 잘못된 URL'); return; }
  $('convertBtn').disabled = true; $('convertBtn').innerHTML = '<svg width="16" height="16"><use href="#i-loader"/></svg>변환 중';
  view('vLoading'); prototypeShell.setState('변환 중');
  setTimeout(() => {
    $('convertBtn').textContent = '변환하기'; syncInput();
    if (/fail|403/.test(v)) { showError('fetch'); prototypeShell.setState('오류: 페이지 가져오기 실패'); }
    else if (/empty|login/.test(v)) { showError('empty'); prototypeShell.setState('오류: 본문 없음'); }
    else { const d = /docs/.test(v) ? DATA.noAuthor : { ...DATA.withAuthor, url: v === DATA.withAuthor.url ? v : v };
      renderResult(d); prototypeShell.setState(d === DATA.noAuthor ? '결과(저자 없음)' : '변환 결과'); }
  }, 1100);
}

function clearAll() {
  url.value = ''; doc = null; setInvalid(false); syncInput(); view('vEmpty'); url.focus();
  prototypeShell.setState('Default');
}

function resetPrompt() { choice = null; prompt = ''; $('customPrompt').value = ''; $('customPrompt').hidden = true; syncPresets(); }
function syncPresets() {
  document.querySelectorAll('#presets .toggle').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === choice));
  prompt = choice === '__custom' ? $('customPrompt').value.trim() : (choice || '');
  $('sendPreview').textContent = prompt ? `“${prompt}” + 본문 Markdown을 보냅니다` : '본문 Markdown만 보냅니다';
}
document.querySelectorAll('#presets .toggle').forEach(b => b.onclick = () => {
  choice = choice === b.dataset.p ? null : b.dataset.p;
  $('customPrompt').hidden = choice !== '__custom';
  if (choice === '__custom') $('customPrompt').focus(); else $('customPrompt').value = '';
  syncPresets();
});
$('customPrompt').oninput = syncPresets;

function toast(title, desc) {
  $('toastTitle').textContent = title; $('toastDesc').textContent = desc || '';
  $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, 3200);
}
function markdownText() { return `# ${doc.title}\n\n${$('rBody').innerText}`; }
$('copyBtn').onclick = () => {
  navigator.clipboard?.writeText(markdownText()).catch(() => {});
  const s = $('copyBtn').querySelector('span'), u = $('copyBtn').querySelector('use');
  s.textContent = '복사됨'; u.setAttribute('href', '#i-check');
  setTimeout(() => { s.textContent = '복사하기'; u.setAttribute('href', '#i-copy'); }, 1600);
};
$('dlBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([markdownText()], { type: 'text/markdown' }));
  a.download = doc.title.replace(/[\\/:*?"<>|]/g, '').slice(0, 80) + '.md'; a.click();
  toast('파일을 저장했습니다', a.download);
};
function sendTo(name) {
  const text = (prompt ? prompt + '\n\n' : '') + markdownText();
  navigator.clipboard?.writeText(text).catch(() => {});
  toast(`${name}를 새 탭에서 열었습니다`, prompt ? '프롬프트와 본문을 복사했어요. 입력창에 붙여넣기(Ctrl+V)만 하세요.' : '본문을 복사했어요. 입력창에 붙여넣기(Ctrl+V)만 하세요.');
}
$('gptBtn').onclick = () => sendTo('ChatGPT');
$('claudeBtn').onclick = () => sendTo('Claude');

url.oninput = () => { syncInput(); if (url.getAttribute('aria-invalid') === 'true') setInvalid(false); };
$('clearBtn').onclick = clearAll;
$('urlForm').onsubmit = e => { e.preventDefault(); convert(); };

// product dark-mode toggle drives the same theme class the shell uses
function syncThemeBtn() {
  const dark = document.documentElement.classList.contains('sh-theme-dark');
  $('themeBtn').querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  $('themeBtn').setAttribute('aria-label', dark ? '라이트 모드로 전환' : '다크 모드로 전환');
  $('themeBtn').title = $('themeBtn').getAttribute('aria-label');
}
$('themeBtn').onclick = () => document.querySelector(`#sh-theme [data-theme="${document.documentElement.classList.contains('sh-theme-dark') ? 'light' : 'dark'}"]`).click();
new MutationObserver(syncThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

// state presets from the review selector
const PRESETS = {
  'Default': () => { url.value = ''; doc = null; setInvalid(false); syncInput(); view('vEmpty'); },
  '변환 중': () => { url.value = DATA.withAuthor.url; setInvalid(false); syncInput(); view('vLoading'); },
  '변환 결과': () => { url.value = DATA.withAuthor.url; setInvalid(false); syncInput(); renderResult(DATA.withAuthor); },
  '결과(저자 없음)': () => { url.value = DATA.noAuthor.url; setInvalid(false); syncInput(); renderResult(DATA.noAuthor); },
  '오류: 잘못된 URL': () => { url.value = 'example.com/글'; doc = null; syncInput(); showError('invalid'); },
  '오류: 페이지 가져오기 실패': () => { url.value = 'https://news.example.kr/article/403'; setInvalid(false); syncInput(); showError('fetch'); },
  '오류: 본문 없음': () => { url.value = 'https://app.example.com/login'; setInvalid(false); syncInput(); showError('empty'); }
};
</script>
</main>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
<script>
  // run product presets whenever the review state selector changes
  document.getElementById('sh-state').addEventListener('change', e => PRESETS[e.target.value]?.());
  addEventListener('load', syncThemeBtn);
</script>
